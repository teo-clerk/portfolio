    <!-- ═══ PERFORMANCE: Load Fira Code font with swap strategy ═══ -->
    <!-- Only load weight 400+700 to minimize download. display=swap ensures text is visible immediately with fallback font -->
    <!-- Fetched as a non-blocking "print" sheet; src/main.jsx flips it to "all" once it has
         loaded. That used to be an inline onload="" handler, which the Content-Security-Policy
         (script-src 'self', see vercel.json) would block. -->
    <link id="deferred-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" media="print" />

    <!-- ═══ PERFORMANCE: Inline critical above-the-fold CSS ═══ -->
    <!-- This lets the browser paint the background + terminal shell before the full CSS bundle arrives -->
    <style>
      :root {
        --bg-color: #0a0a0a;
        --terminal-bg: rgba(20, 20, 20, 0.5);
        --text-color: #FFFFFF;
        --accent-color: #8A2BE2;
        --glass-border: rgba(255, 255, 255, 0.2);
        --font-stack: 'Fira Code', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: var(--bg-color);
        /* LQIP inline — 3KB blurred placeholder loads instantly */
        background-image: url('/bg-hero-lqip.webp');
        background-size: cover;
        background-position: center;
        height: 100vh; height: 100dvh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-stack);
        color: var(--text-color);
        overflow: hidden;
        position: relative;
      }
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background: inherit;
        filter: grayscale(100%) contrast(1.1) brightness(0.6);
        z-index: -1;
      }
      #root { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
      /* Off-screen until focused: a crawlable, keyboard-reachable way out of the terminal UI. */
      .skip-link { position: absolute; left: -9999px; top: 0; background: #8A2BE2; color: #fff; padding: .6rem 1rem; z-index: 10000; }
      .skip-link:focus { left: 0; }
    </style>
